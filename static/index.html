<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <meta name="description" content="Персональный способ выбрать фильм на вечер — по настроению, вкусу и времени.">
  <title>Swipe&Watch — кино по настроению</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Главная навигация">
      <a class="brand" href="#home" aria-label="Swipe and Watch — главная">
        <span class="brand-mark"><span></span><span></span></span>
        <span class="brand-word">swipe<span>&</span>watch</span>
      </a>
      <nav class="main-nav">
        <button class="nav-item active" data-page="home"><span class="nav-icon" data-icon="home"></span><span>Главная</span></button>
        <button class="nav-item" data-page="discover"><span class="nav-icon" data-icon="sparkles"></span><span>Подбор</span></button>
        <button class="nav-item" data-page="collection"><span class="nav-icon" data-icon="bookmark"></span><span>Коллекция</span><span class="nav-count" id="navWatchCount">0</span></button>
        <button class="nav-item" data-page="history"><span class="nav-icon" data-icon="history"></span><span>История</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="side-note">
          <span class="side-note-mark">✳</span>
          <div><strong>Хороший вечер<br>начинается с выбора.</strong><small>Остальное мы поможем найти.</small></div>
        </div>
        <button class="profile-mini" data-page="profile">
          <span class="avatar" id="sideAvatar">К</span>
          <span class="profile-mini-copy"><strong id="sideName">Киноман</strong><small id="sideStatus">Гостевой профиль</small></span>
          <span class="profile-chevron">›</span>
        </button>
      </div>
    </aside>

    <div class="main-column">
      <div id="netBanner" class="net-banner" role="alert" hidden>Нет соединения с сервером. Изменения могут не сохраниться — проверьте интернет.</div>
      <header class="topbar">
        <div class="breadcrumb"><span>SWIPE&WATCH</span><i>/</i><strong id="pageLabel">Главная</strong></div>
        <div class="topbar-actions">
          <button class="top-help" data-action="help" aria-label="Как это работает?" title="Как это работает?"><span data-icon="help"></span></button>
          <button class="top-avatar" data-page="profile" id="topAvatar" aria-label="Профиль">К</button>
        </div>
      </header>
      <main id="view" class="page-content" tabindex="-1">
        <div class="boot-state"><span class="loader"></span><p>Настраиваем ваш кинозал…</p></div>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Мобильная навигация">
    <button class="mobile-nav-item active" data-page="home"><span data-icon="home"></span><small>Главная</small></button>
    <button class="mobile-nav-item" data-page="discover"><span data-icon="sparkles"></span><small>Подбор</small></button>
    <button class="mobile-nav-item" data-page="collection"><span data-icon="bookmark"></span><small>Коллекция</small></button>
    <button class="mobile-nav-item" data-page="history"><span data-icon="history"></span><small>История</small></button>
    <button class="mobile-nav-item" data-page="profile"><span data-icon="user"></span><small>Профиль</small></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
</body>
</html>
